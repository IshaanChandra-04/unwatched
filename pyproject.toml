[project]
name = "unwatched"
version = "0.2.0"
description = "Turn the reels you saved or sent yourself into a document you will actually read."
readme = "README.md"
license = "MIT"
# PyAV 13 (the last release faster-whisper works with) has no wheels for Python 3.14
requires-python = ">=3.11,<3.14"
authors = [{ name = "IshaanChandra-04" }]
keywords = ["instagram", "reels", "transcription", "whisper", "yt-dlp", "claude-code", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "playwright>=1.50",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "av<14",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/IshaanChandra-04/unwatched"
Repository = "https://github.com/IshaanChandra-04/unwatched"
Changelog = "https://github.com/IshaanChandra-04/unwatched/blob/main/CHANGELOG.md"

[project.scripts]
unwatched = "unwatched.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unwatched"]

[tool.hatch.build.targets.wheel.force-include]
"skills/unwatched/SKILL.md" = "unwatched/skill/SKILL.md"
"profiles" = "unwatched/profiles"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a Playwright Chromium install"]
