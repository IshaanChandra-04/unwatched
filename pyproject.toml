[project]
name = "unwatched"
version = "0.1.1"
description = "Turn the reels you saved or sent yourself into a document you will actually read."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.50",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "av<14",
    "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/IshaanChandra-04/unwatched"
Repository = "https://github.com/IshaanChandra-04/unwatched"
Changelog = "https://github.com/IshaanChandra-04/unwatched/blob/main/CHANGELOG.md"

[project.scripts]
unwatched = "unwatched.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unwatched"]

[tool.hatch.build.targets.wheel.force-include]
"skills/unwatched/SKILL.md" = "unwatched/skill/SKILL.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: needs a Playwright Chromium install"]
